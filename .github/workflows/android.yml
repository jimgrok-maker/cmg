name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install jsdom for full-page tests
        run: |
          mkdir -p /tmp/cmg-test-deps
          npm --prefix /tmp/cmg-test-deps install --no-save jsdom

      - name: Run JS and jsdom tests
        env:
          NODE_PATH: /tmp/cmg-test-deps/node_modules
        run: node --test 'tests/*.test.js'

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          VER=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | cut -d'"' -f2)
          cp app/build/outputs/apk/debug/app-debug.apk "dist/cmg-${VER}-debug.apk"
          ls -la dist app/build/outputs/apk/debug || true

      - uses: actions/upload-artifact@v4
        with:
          name: cmg-apk
          path: dist/cmg-*-debug.apk
